ZdLXSsYwum5P6rzYdqkCchE=
-----END PRIVATE KEY-----`;

        /** ماژول‌های اختیاری */
        const OPTIONAL_MODULES = [
            { id: 'inventory', label: 'انبارداری', group: 'انبارداری' },
            { id: 'warehouses', label: 'انبارها', group: 'انبارداری' },
            { id: 'blog', label: 'بلاگ و اخبار', group: 'محتوا' },
            { id: 'chat', label: 'چت زنده', group: 'ارتباطات' },
            { id: 'tickets', label: 'تیکتینگ و پشتیبانی', group: 'ارتباطات' },
            { id: 'bookings', label: 'نوبت‌دهی و رزرو', group: 'فروش' },
            { id: 'vendors', label: 'فروشندگان', group: 'فروش' },
            { id: 'returns', label: 'مرجوعی کالا', group: 'فروش' },
            { id: 'email_templates', label: 'قالب‌های ایمیل', group: 'بازاریابی' },
            { id: 'newsletters', label: 'خبرنامه', group: 'بازاریابی' },
            { id: 'variants', label: 'متغیرهای محصول', group: 'محصول' },
            { id: 'wallets', label: 'کیف پول و وفاداری', group: 'مالی' },
            { id: 'reviews', label: 'نظرات و امتیازات', group: 'تعاملات' },
            { id: 'questions', label: 'پرسش و پاسخ', group: 'تعاملات' },
            { id: 'wishlists', label: 'علاقه‌مندی‌ها', group: '互动' },
            { id: 'page_stats', label: 'آمار بازدید', group: '互动' },
            { id: 'banners', label: 'بنرها و کمپین‌ها', group: '互动' },
            { id: 'compare', label: 'مقایسه محصولات', group: '互动' },
            { id: 'departments', label: 'دپارتمان‌ها', group: '互动' },
            { id: 'templates', label: 'قالب‌ها', group: '互动' },
            { id: 'notifications', label: 'اعلانات', group: '互动' },
            { id: 'gift_cards', label: 'کارت هدیه', group: '互动' },
            { id: 'loyalty', label: 'باشگاه مشتریان', group: '互动' },
        ];

        function LicenseGenerator() {
            const [clientName, setClientName] = useState('');
            const [machineId, setMachineId] = useState('');
            const [expiryMonths, setExpiryMonths] = useState(12);
            const [selectedModules, setSelectedModules] = useState(
                OPTIONAL_MODULES.reduce((acc, mod) => ({ ...acc, [mod.id]: true }), {})
            );
            const [generatedToken, setGeneratedToken] = useState('');
            const [copied, setCopied] = useState(false);

            const generateJWT = () => {
                if (!clientName || !machineId) {
                    alert('لطفاً نام مشتری و شناسه ماشین (Machine ID) را وارد کنید.');
                    return;
                }

                const expDate = new Date();
                expDate.setMonth(expDate.getMonth() + expiryMonths);
                const expTimestamp = Math.floor(expDate.getTime() / 1000);

                const header = { alg: "RS256", typ: "JWT" };
                const payload = {
                    client_name: clientName,
                    machine_id: machineId.trim(),
                    exp: expTimestamp,
                    iat: Math.floor(Date.now() / 1000),
                    iss: "Clubinex_License_Server",
                    modules: selectedModules,
                };

                try {
                    const sHeader = JSON.stringify(header);
                    const sPayload = JSON.stringify(payload);
                    const sJWT = KJUR.jws.JWS.sign("RS256", sHeader, sPayload, PRIVATE_KEY);
                    setGeneratedToken(sJWT);
                    setCopied(false);
                } catch (e) {
                    alert('خطا در صدور لایسنس: ' + e.message);
                }
            };

            const toggleModule = (id) => {
                setSelectedModules(prev => ({ ...prev, [id]: !prev[id] }));
            };

            const selectAll = () => {
                setSelectedModules(OPTIONAL_MODULES.reduce((acc, mod) => ({ ...acc, [mod.id]: true }), {}));
            };

            const deselectAll = () => {
                setSelectedModules(OPTIONAL_MODULES.reduce((acc, mod) => ({ ...acc, [mod.id]: false }), {}));
            };

            const copyToClipboard = () => {
                navigator.clipboard.writeText(generatedToken);
                setCopied(true);
                setTimeout(() => setCopied(false), 2000);
            };

            const enabledCount = Object.values(selectedModules).filter(Boolean).length;

            /** گروه‌بندی ماژول‌ها */
            const groupedModules = OPTIONAL_MODULES.reduce((acc, mod) => {
                if (!acc[mod.group]) acc[mod.group] = [];
                acc[mod.group].push(mod);
                return acc;
            }, {});

            return (
                <div className="max-w-4xl mx-auto space-y-6">
                    {/* هدر */}
                    <div className="bg-gradient-to-r from-indigo-600 to-purple-700 rounded-2xl p-8 text-white shadow-lg">
                        <h1 className="text-3xl font-black mb-2">🔐 مدیریت لایسنس Clubinex</h1>
                        <p className="text-indigo-100 mb-4">ابزار آفلاین صدور لایسنس JWT RS256</p>

                        <div className="bg-white/10 rounded-xl p-4 border border-white/20">
                            <h3 className="font-bold mb-2">⚠️ هشدار امنیتی</h3>
                            <p className="text-sm text-indigo-100 leading-relaxed">
                                • این فایل حاوی <span className="font-bold text-white">کلید خصوصی</span> است — هرگز آن را در اختیار مشتری قرار ندهید!<br/>
                                • فقط توسط کارشناسان پشتیبانی و فروش استفاده شود.<br/>
                                • Machine ID را از بخش <span className="font-bold text-white">تنظیمات → لایسنس</span> در پنل مشتری دریافت کنید.
                            </p>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        {/* اطلاعات مشتری */}
                        <div className="bg-white rounded-2xl p-6 shadow-sm border">
                            <h2 className="text-xl font-bold mb-4 border-b pb-2">اطلاعات مشتری</h2>
                            <div className="space-y-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">نام مشتری یا شرکت</label>
                                    <input
                                        type="text"
                                        className="w-full rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border"
                                        placeholder="مثال: هلدینگ صبا"
                                        value={clientName}
                                        onChange={e => setClientName(e.target.value)}
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">شناسه ماشین (Machine ID)</label>
                                    <input
                                        type="text"
                                        dir="ltr"
                                        className="w-full rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border font-mono text-sm"
                                        placeholder="از پنل مدیریت مشتری → تنظیمات → لایسنس"
                                        value={machineId}
                                        onChange={e => setMachineId(e.target.value)}
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">مدت اعتبار</label>
                                    <select
                                        className="w-full rounded-lg border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border"
                                        value={expiryMonths}
                                        onChange={e => setExpiryMonths(Number(e.target.value))}
                                    >
                                        <option value={1}>۱ ماهه (آزمایشی)</option>
                                        <option value={3}>۳ ماهه</option>
                                        <option value={6}>۶ ماهه</option>
                                        <option value={12}>یک ساله</option>
                                        <option value={60}>۵ ساله</option>
                                        <option value={120}>۱۰ ساله (مادام‌العمر)</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        {/* ماژول‌ها */}
                        <div className="bg-white rounded-2xl p-6 shadow-sm border">
                            <div className="flex items-center justify-between mb-4 border-b pb-2">
                                <h2 className="text-xl font-bold">ماژول‌های اختیاری</h2>
                                <span className="text-sm text-indigo-600 font-medium">{enabledCount} / {OPTIONAL_MODULES.length}</span>
                            </div>

                            <div className="flex gap-2 mb-3">
                                <button onClick={selectAll} className="text-xs px-3 py-1 rounded-lg bg-indigo-50 text-indigo-600 hover:bg-indigo-100">انتخاب همه</button>
                                <button onClick={deselectAll} className="text-xs px-3 py-1 rounded-lg bg-gray-50 text-gray-600 hover:bg-gray-100">حذف انتخاب</button>
                            </div>

                            <div className="space-y-3 max-h-80 overflow-y-auto pl-2">
                                {Object.entries(groupedModules).map(([group, modules]) => (
                                    <div key={group}>
                                        <p className="text-xs font-medium text-gray-400 mb-1">{group}</p>
                                        <div className="space-y-1">
                                            {modules.map(mod => (
                                                <label key={mod.id} className="flex items-center gap-2 p-2 border rounded-lg hover:bg-gray-50 cursor-pointer transition-colors">
                                                    <input
                                                        type="checkbox"
                                                        className="w-4 h-4 text-indigo-600 rounded border-gray-300 focus:ring-indigo-500"
                                                        checked={selectedModules[mod.id]}
                                                        onChange={() => toggleModule(mod.id)}
                                                    />
                                                    <span className="text-sm text-gray-700">{mod.label}</span>
                                                    <span className="text-[10px] text-gray-400 font-mono mr-auto">{mod.id}</span>
                                                </label>
                                            ))}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>

                    {/* دکمه صدور */}
                    <div className="flex justify-center py-4">
                        <button
                            onClick={generateJWT}
                            className="bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white font-bold py-3 px-12 rounded-full text-lg shadow-lg hover:shadow-xl transition-all transform hover:-translate-y-1"
                        >
                            🔑 صدور لایسنس
                        </button>
                    </div>

                    {/* نتیجه */}
                    {generatedToken && (
                        <div className="bg-green-50 rounded-2xl p-6 border border-green-200">
                            <div className="flex justify-between items-center mb-4">
                                <h2 className="text-xl font-bold text-green-800">✅ لایسنس صادر شد</h2>
                                <button
                                    onClick={copyToClipboard}
                                    className="px-4 py-2 bg-green-600 hover:bg-green-700 text-white rounded-lg text-sm font-bold transition-colors"
                                >
                                    {copied ? '✓ کپی شد!' : '📋 کپی لایسنس'}
                                </button>
                            </div>
                            <p className="text-sm text-green-700 mb-2">این متن را برای مشتری ارسال کنید تا در بخش <strong>تنظیمات → لایسنس → فعال‌سازی</strong> وارد کند:</p>
                            <textarea
                                readOnly
                                value={generatedToken}
                                dir="ltr"
                                className="w-full h-32 p-4 font-mono text-xs bg-white rounded-xl border border-green-300 focus:outline-none resize-none break-all"
                            />
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<LicenseGenerator />);
    </script>
</body>
